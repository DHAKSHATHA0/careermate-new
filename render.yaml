services:
  - type: web
    name: careermate
    env: python
    buildCommand: "pip install -r requirements.txt && python -m spacy download en_core_web_sm && python seed_db.py"
    startCommand: "gunicorn run:app"
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.11.9
